*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7fc4e8;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}#status{position:fixed;inset:0;z-index:8;display:grid;place-items:center;text-align:center;padding:24px;color:#27312e;background:#d6e6df;font-size:16px;line-height:1.5}#status.hidden{display:none}
#touch-controls{position:fixed;z-index:5;left:50%;bottom:8px;transform:translateX(-50%);width:min(680px,calc(100vw - 20px));padding:9px 12px 10px;border:1px solid #6e85965e;border-radius:18px;background:linear-gradient(145deg,#101c28f2,#1a2d3cf0);color:#e7edf2;box-shadow:0 8px 28px #0005;display:grid;gap:8px;touch-action:none;user-select:none}.joint-selector{display:flex;align-items:center;justify-content:center;gap:5px;padding-bottom:7px;border-bottom:1px solid #ffffff20}.control-caption{font-size:9px;color:#aab9c5;letter-spacing:.13em;margin-right:4px;white-space:nowrap}.joint-button{width:29px;height:24px;border:1px solid #71839288;border-radius:7px;background:#273b4b;color:#dce6ec;font:600 10px system-ui,sans-serif}.joint-button.active{background:#c68d43;border-color:#f3c77d;color:#171d22}.controller-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:15px}.joystick-wrap{display:grid;justify-items:center;gap:4px}.joystick-title{font-size:8px;letter-spacing:.16em;color:#aab9c5}.joystick{position:relative;width:98px;height:98px;border:1px solid #8096a688;border-radius:50%;background:radial-gradient(circle at 50% 48%,#32495b 0,#263c4d 54%,#172a39 56%,#101e2b 100%);box-shadow:inset 0 2px 8px #0008,0 3px 10px #0004;touch-action:none}.joystick:before,.joystick:after{content:"";position:absolute;background:#a4b5c422}.joystick:before{width:1px;top:12%;bottom:12%;left:50%}.joystick:after{height:1px;left:12%;right:12%;top:50%}.stick-knob{position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);border:1px solid #d1e0e9aa;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aabb6,#465d6e 72%);box-shadow:0 3px 8px #0008;pointer-events:none}.center-controls{display:grid;justify-items:center;gap:7px}.control-caption.center{margin:0}.small-row{display:flex;align-items:center;gap:4px}.zoom-label{font-size:8px;color:#aab9c5;letter-spacing:.12em;margin-right:2px}.panel-credit{font-size:7px;color:#8297a6;letter-spacing:.13em;margin-top:1px}.mini-button,.action-button,.auto-button{border:1px solid #71839288;border-radius:7px;background:#263b4b;color:#e0e9ef;font:600 10px system-ui,sans-serif;touch-action:none;user-select:none}.mini-button{width:27px;height:26px;padding:0}.action-button{height:27px;padding:0 7px}.auto-button{width:98px;height:29px;background:#286273;border-color:#58a5ae;color:#f2fcff;font-weight:700;letter-spacing:.05em}.auto-button.active{background:#d59743;border-color:#f3c77d;color:#19212a}.mini-button:active,.action-button:active,.auto-button:active{filter:brightness(1.3)}
@media(max-width:600px){#touch-controls{width:calc(100vw - 12px);bottom:5px;padding:7px 8px 8px;gap:6px;border-radius:15px}.joint-selector{gap:4px;padding-bottom:6px}.control-caption{font-size:8px;margin-right:2px}.joint-button{width:27px;height:23px}.controller-body{grid-template-columns:1fr auto 1fr;gap:3px}.joystick{width:82px;height:82px}.stick-knob{width:34px;height:34px}.joystick-wrap{gap:3px}.joystick-title{font-size:7px}.center-controls{gap:5px}.auto-button{width:90px;height:27px;font-size:9px}.mini-button{width:23px;height:23px;font-size:9px}.action-button{height:24px;padding:0 5px;font-size:9px}.small-row{gap:3px}.control-caption.center{font-size:7px}.panel-credit{font-size:6px;margin-top:0}}@media(max-width:350px){.joystick{width:72px;height:72px}.stick-knob{width:30px;height:30px}.joint-button{width:24px}.joint-selector{gap:3px}.controller-body{gap:1px}.auto-button{width:82px}.mini-button{width:21px}}

<body>
<div id="status">Cargando la escena 3D…</div>
<section id="touch-controls" aria-label="Control del rover">
 <div class="joint-selector"><span class="control-caption">BRAZO</span><button class="joint-button active" data-motor="0" aria-label="Articulación 1">1</button><button class="joint-button" data-motor="1" aria-label="Articulación 2">2</button><button class="joint-button" data-motor="2" aria-label="Articulación 3">3</button><button class="joint-button" data-motor="3" aria-label="Articulación 4">4</button><button class="joint-button" data-motor="4" aria-label="Articulación 5">5</button><button class="joint-button" data-motor="5" aria-label="Articulación 6">6</button><button class="joint-button" data-motor="6" aria-label="Pinza">7</button></div>
 <div class="controller-body">
  <div class="joystick-wrap"><span class="joystick-title">MOVIMIENTO</span><div class="joystick" id="drive-stick" role="application" aria-label="Joystick de movimiento"><div class="stick-knob"></div></div></div>
 <div class="center-controls"><span class="control-caption center">ROVER 6×6</span><button id="auto-drive" class="auto-button" type="button" aria-pressed="false">AUTO AVANCE</button><div class="small-row"><button class="mini-button" data-key="q" title="Girar cámara a la izquierda" aria-label="Girar cámara a la izquierda">↶</button><button class="mini-button" data-key="e" title="Girar cámara a la derecha" aria-label="Girar cámara a la derecha">↷</button><button class="mini-button" data-key="r" title="Cámara arriba" aria-label="Cámara arriba">↑</button><button class="mini-button" data-key="f" title="Cámara abajo" aria-label="Cámara abajo">↓</button></div><div class="small-row zoom-row"><span class="zoom-label">ZOOM</span><button class="mini-button" data-zoom="out" title="Alejar cámara" aria-label="Alejar cámara">−</button><button class="mini-button" data-zoom="in" title="Acercar cámara" aria-label="Acercar cámara">+</button></div><div class="small-row"><button class="action-button" data-action="close">− CERRAR</button><button class="action-button" data-action="open">+ ABRIR</button></div><span class="panel-credit">HECHO POR SKELETON.CL</span></div>
  <div class="joystick-wrap"><span class="joystick-title" id="stick-selection">ARTICULACIÓN 1</span><div class="joystick" id="arm-stick" role="application" aria-label="Joystick para mover articulación seleccionada"><div class="stick-knob"></div></div></div>
 </div>

<script>
const statusBox=document.querySelector('#status');
function loadThree(urls,index=0){if(index>=urls.length){statusBox.innerHTML='No se pudo cargar Three.js.<br>Conéctate a internet y recarga la página.';return}const s=document.createElement('script');s.src=urls[index];s.onload=build;s.onerror=()=>loadThree(urls,index+1);document.head.appendChild(s)}
function build(){try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83c7ec);scene.fog=new THREE.Fog(0x83c7ec,55,125);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf7ff,0x624331,.8));const sun=new THREE.DirectionalLight(0xffe6c5,.72);sun.position.set(-9,16,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);
const mat=(color,roughness=.72,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const M={ground:new THREE.MeshStandardMaterial({color:0x48a642,roughness:1}),rock:new THREE.MeshStandardMaterial({color:0x858d93,roughness:.92,side:THREE.DoubleSide}),rockDark:mat(0x676e72,.9),al:mat(0xb9bcb6,.4,.5),frame:mat(0x777b75,.52,.32),rocker:mat(0x596260,.48,.52),bogie:mat(0x858b85,.52,.42),bearing:mat(0xc2c0b4,.36,.62),body:mat(0xe3d6b5,.66,.05),deck:mat(0xd2c9ad,.6),solar:mat(0x173d68,.36,.25),tire:mat(0x252a29,.92),tread:mat(0x424845,.9),lens:mat(0x497b87,.2,.35),bottle:mat(0xb45f38,.38,.18)};
function box(parent,w,h,d,material,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function link(parent,r,material){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,16),material);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function place(o,a,b){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);o.position.copy(A).add(B).multiplyScalar(.5);o.scale.y=d.length();o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize())}
function pin(parent,r,material){const o=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),material);o.castShadow=true;parent.add(o);return o}
function bearing(parent,r=.17){const g=new THREE.Group();parent.add(g);const disk=new THREE.Mesh(new THREE.CylinderGeometry(r,r,.12,28),M.frame);disk.rotation.z=Math.PI/2;disk.castShadow=true;disk.receiveShadow=true;g.add(disk);const rim=new THREE.Mesh(new THREE.TorusGeometry(r*.78,.023,8,28),M.bearing);rim.rotation.y=Math.PI/2;rim.castShadow=true;g.add(rim);const cap=new THREE.Mesh(new THREE.CylinderGeometry(r*.38,r*.38,.15,20),M.al);cap.rotation.z=Math.PI/2;cap.castShadow=true;g.add(cap);return g}
// Green open terrain and gray climbable rock ramps.
const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),M.ground);floor.rotation.x=-Math.PI/2;floor.position.y=-.06;floor.receiveShadow=true;scene.add(floor);
const obstacles=[{type:'ramp',halfWidth:2.25,start:3.2,topStart:6.3,topEnd:8.2,end:11.5,height:1.15},{type:'pyramid',centerX:0,centerZ:22,halfWidth:8,halfDepth:8,height:8}];
function rampHeight(z,o){if(z<=o.start||z>=o.end)return 0;if(z<o.topStart)return o.height*(z-o.start)/(o.topStart-o.start);if(z<=o.topEnd)return o.height;return o.height*(o.end-z)/(o.end-o.topEnd)}
function obstacleHeight(x,z,o){if(o.type==='pyramid'){const dx=Math.abs(x-o.centerX)/o.halfWidth,dz=Math.abs(z-o.centerZ)/o.halfDepth;return o.height*Math.max(0,1-Math.max(dx,dz))}const edgeRun=.95;if(Math.abs(x)>=o.halfWidth)return 0;const side=Math.min(1,(o.halfWidth-Math.abs(x))/edgeRun);return rampHeight(z,o)*side}
function groundHeight(x,z){return Math.max(0,...obstacles.map(o=>obstacleHeight(x,z,o)))}
function ramp(o){const nx=48,nz=64,positions=[],indices=[];for(let iz=0;iz<=nz;iz++){const z=o.start+(o.end-o.start)*iz/nz;for(let ix=0;ix<=nx;ix++){const x=-o.halfWidth+2*o.halfWidth*ix/nx;positions.push(x,obstacleHeight(x,z,o),z)}}for(let iz=0;iz<nz;iz++)for(let ix=0;ix<nx;ix++){const a=iz*(nx+1)+ix,b=a+1,c=a+nx+1,d=c+1;indices.push(a,c,b,b,c,d)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(indices);g.computeVertexNormals();const m=new THREE.Mesh(g,M.rock);m.castShadow=true;m.receiveShadow=true;scene.add(m)}
function pyramid(o){const x0=o.centerX-o.halfWidth,x1=o.centerX+o.halfWidth,z0=o.centerZ-o.halfDepth,z1=o.centerZ+o.halfDepth,apex=[o.centerX,o.height,o.centerZ],corners=[[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]],positions=[];for(let i=0;i<4;i++){const a=corners[i],b=corners[(i+1)%4];positions.push(...a,...b,...apex)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.computeVertexNormals();const m=new THREE.Mesh(g,M.rock);m.castShadow=true;m.receiveShadow=true;scene.add(m)}
obstacles.forEach(o=>o.type==='pyramid'?pyramid(o):ramp(o));
// Rover: body, six powered wheels and the six-axis science arm.
const rover=new THREE.Group();scene.add(rover);const chassis=new THREE.Group();chassis.name='chassis';rover.add(chassis);
const roverBody=box(chassis,2.05,.43,2.58,M.body,0,1.45,0);roverBody.name='rover-body';const roverTop=box(chassis,2.14,.07,2.65,M.al,0,1.70,0);roverTop.name='rover-top';const roverDeck=box(chassis,1.54,.22,1.46,M.deck,0,1.82,-.05);roverDeck.name='rover-deck';const solarPanel=box(chassis,.78,.045,1.26,M.solar,0,1.96,-.05);solarPanel.name='solar-panel';for(const x of [-.25,0,.25]){const bar=box(chassis,.022,.01,1.2,M.al,x,1.99,-.05);bar.name='solar-grid-bar'}
// Mast and stereo navigation cameras.
const mast=link(chassis,.055,M.al);mast.name='camera-mast';mast.position.set(0,2.18,-.62);mast.scale.y=.62;const mastPan=new THREE.Group();mastPan.name='camera';mastPan.position.set(0,2.5,-.62);chassis.add(mastPan);const mastHead=new THREE.Group();mastPan.add(mastHead);box(mastHead,.56,.31,.46,M.frame);box(mastHead,.38,.17,.12,M.lens,0,.01,.25);for(const x of [-.14,.14]){const lens=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.035,16),M.lens);lens.rotation.x=Math.PI/2;lens.position.set(x,.01,.32);mastHead.add(lens)}
// Six wheels, with aligned hubs, caps and visible traction bars.
const wheelR=.51,wheels=[];for(const side of [-1,1])for(let n=0;n<3;n++){const z=[1.02,0,-1.02][n],hubGroup=new THREE.Group();hubGroup.name='wheel-hub';hubGroup.position.set(side*1.34,wheelR,z);rover.add(hubGroup);const wheel=new THREE.Group();wheel.name='rolling-wheel';hubGroup.add(wheel);const tire=new THREE.Mesh(new THREE.CylinderGeometry(wheelR,wheelR,.31,40),M.tire);tire.rotation.z=Math.PI/2;tire.castShadow=true;tire.receiveShadow=true;wheel.add(tire);for(const [r,len,material] of [[.24,.34,M.al],[.12,.36,M.frame]]){const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,24),material);c.rotation.z=Math.PI/2;wheel.add(c)}for(let i=0;i<20;i++){const a=i*Math.PI*2/20,t=box(wheel,.34,.055,.075,M.tread,0,Math.cos(a)*(wheelR+.012),Math.sin(a)*(wheelR+.012));t.rotation.x=a}wheels.push({side,n,z,hubGroup,wheel})}
// Rocker-bogie arms adjust to the sampled ground height under each wheel.
const suspension=[];for(const side of [-1,1]){const tag=side<0?'left':'right';box(chassis,.23,.26,.35,M.rocker,side*1.05,1.16,.04);const front=link(rover,.115,M.rocker),rear=link(rover,.12,M.rocker),bogie=link(rover,.10,M.bogie),midBrace=link(rover,.055,M.al),rearBrace=link(rover,.055,M.al),joints=Array.from({length:5},()=>pin(rover,.105,M.frame)),pivotBearings=[bearing(rover,.18),bearing(rover,.15)];front.name=`susp-${tag}-front`;rear.name=`susp-${tag}-rear`;bogie.name=`susp-${tag}-bogie`;midBrace.name=`susp-${tag}-mid`;rearBrace.name=`susp-${tag}-rearbrace`;joints.forEach((o,i)=>o.name=`susp-${tag}-joint-${i}`);pivotBearings.forEach((o,i)=>o.name=`susp-${tag}-bearing-${i}`);suspension.push({side,front,rear,bogie,midBrace,rearBrace,joints,pivotBearings})}
// Visible differential across the chassis.
box(chassis,.56,.34,.48,M.rocker,0,1.04,.04);const diff=link(chassis,.075,M.al);place(diff,[-1.16,1.12,.04],[1.16,1.12,.04]);
const diffLeft=link(chassis,.045,M.frame),diffRight=link(chassis,.045,M.frame);place(diffLeft,[0,1.12,.04],[-1.05,1.16,.04]);place(diffRight,[0,1.12,.04],[1.05,1.16,.04]);
// Six-axis sampling arm on the rover's front deck.
const base=new THREE.Group();base.name='manipulator';base.position.set(0,1.65,1.0);chassis.add(base);const disk=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.16,24),M.frame);base.add(disk);
const yaw=new THREE.Group();yaw.position.y=.1;base.add(yaw);const shoulder=new THREE.Group();yaw.add(shoulder);pin(shoulder,.15,M.al);box(shoulder,.19,.16,.72,M.al,0,0,.36);
const elbow=new THREE.Group();elbow.position.z=.72;shoulder.add(elbow);pin(elbow,.14,M.frame);box(elbow,.15,.14,.58,M.al,0,0,.29);
const wrist=new THREE.Group();wrist.position.z=.58;elbow.add(wrist);pin(wrist,.11,M.al);box(wrist,.12,.12,.3,M.frame,0,0,.15);
const roll=new THREE.Group();roll.position.z=.3;wrist.add(roll);const grip=new THREE.Group();grip.position.z=.13;roll.add(grip);box(grip,.29,.16,.24,M.body);
const fingers=[];for(const side of [-1,1]){const finger=new THREE.Group();finger.position.set(side*.13,0,.12);grip.add(finger);box(finger,.05,.06,.23,M.al,0,0,.1);fingers.push({finger,side})}
const bottle=new THREE.Group(),bottleHeight=.86;bottle.position.set(.12,groundHeight(.12,2.1),2.1);scene.add(bottle);
function bottlePart(geometry,material,y){const part=new THREE.Mesh(geometry,material);part.position.y=y;part.castShadow=true;part.receiveShadow=true;bottle.add(part);return part}
bottlePart(new THREE.CylinderGeometry(.13,.15,.54,24),M.bottle,.28);bottlePart(new THREE.CylinderGeometry(.065,.13,.15,24),M.bottle,.625);bottlePart(new THREE.CylinderGeometry(.058,.065,.1,20),M.bottle,.75);bottlePart(new THREE.CylinderGeometry(.074,.074,.07,20),M.al,.835);bottlePart(new THREE.CylinderGeometry(.136,.14,.1,24),M.deck,.31);
let heldBottle=null,container=null;const bottleVelocity=new THREE.Vector3();
function releaseBottle(){if(!heldBottle)return;const position=heldBottle.getWorldPosition(new THREE.Vector3()),rotation=heldBottle.getWorldQuaternion(new THREE.Quaternion());grip.remove(heldBottle);scene.add(bottle);bottle.position.copy(position);bottle.quaternion.copy(rotation);heldBottle=null;bottleVelocity.set(0,0,0);if(container){container.updateWorldMatrix(true,false);const center=container.localToWorld(new THREE.Vector3(0,0,0));if(Math.abs(position.x-center.x)<.90&&Math.abs(position.z-center.z)<1.20){container.add(bottle);bottle.position.set(0,1.28,0);bottle.rotation.set(0,0,0)}}}
function tryGrabBottle(){if(heldBottle||gripperOpening>.18)return;grip.updateWorldMatrix(true,false);bottle.updateWorldMatrix(true,false);const pinch=grip.localToWorld(new THREE.Vector3(0,0,.24)),center=bottle.localToWorld(new THREE.Vector3(0,bottleHeight/2,0));if(pinch.distanceTo(center)>.32)return;bottle.parent.remove(bottle);grip.add(bottle);bottle.position.set(0,-bottleHeight/2,.24);bottle.quaternion.identity();heldBottle=bottle}
function bottleSurface(x,z){let surface=groundHeight(x,z);if(!container)return surface;container.updateWorldMatrix(true,false);const center=container.localToWorld(new THREE.Vector3(0,0,0)),dx=Math.abs(x-center.x),dz=Math.abs(z-center.z);if(dx<.90&&dz<1.20){surface=Math.max(surface,container.localToWorld(new THREE.Vector3(0,1.28,0)).y)}else if(dx<1.04&&dz<1.30&&(dx>.90||dz>1.20)){surface=Math.max(surface,container.localToWorld(new THREE.Vector3(0,1.665,0)).y)}return surface}
function updateBottle(dt){if(!heldBottle&&bottle.parent!==container){const surface=bottleSurface(bottle.position.x,bottle.position.z);if(bottle.position.y>surface){bottleVelocity.y-=9.8*dt;bottle.position.y+=bottleVelocity.y*dt;const nextSurface=bottleSurface(bottle.position.x,bottle.position.z);if(bottle.position.y<nextSurface){bottle.position.y=nextSurface;bottleVelocity.y=0}}}if(!heldBottle&&gripperOpening<=.18)tryGrabBottle()}
const armMotors=[{group:yaw,axis:'y',angle:0,min:-1.5,max:1.5},{group:shoulder,axis:'x',angle:-.28,min:-1.05,max:.8},{group:elbow,axis:'x',angle:.58,min:-1.4,max:1.4},{group:wrist,axis:'x',angle:-.22,min:-1.2,max:1.2},{group:roll,axis:'z',angle:0,min:-2.8,max:2.8},{group:grip,axis:'x',angle:0,min:-1,max:1}];
for(const motor of armMotors)motor.group.rotation[motor.axis]=motor.angle;
let gripperOpening=.55;function setGripperOpening(value){gripperOpening=THREE.MathUtils.clamp(value,0,1);const gap=.055+.115*gripperOpening;for(const item of fingers)item.finger.position.x=item.side*gap;if(heldBottle&&gripperOpening>.3)releaseBottle()}setGripperOpening(gripperOpening);
function moveArmMotor(index,direction,step=.12){if(index===6){setGripperOpening(gripperOpening+direction*step);return}const motor=armMotors[index];motor.angle=THREE.MathUtils.clamp(motor.angle+direction*step,motor.min,motor.max);motor.group.rotation[motor.axis]=motor.angle}
// Orbit camera, zoom and rover driving.
let az=Math.PI,el=.48,mobileView=innerWidth<=600,dist=mobileView?27:20,drag=false,lastX=0,lastY=0,selectedArmMotor=0,autoDrive=false;const pressed=new Set(),driveAxis={x:0,y:0},armAxis={x:0,y:0};

function updateTerrain(dt=1){
  const samples=[];

    const frontP=[s.side*1.34,wheelR+height(0)-rover.position.y,1.02];
    const midP=[s.side*1.34,wheelR+height(1)-rover.position.y,0];
    const rearP=[s.side*1.34,wheelR+height(2)-rover.position.y,-1.02];
    const pivot=toRover([s.side*1.08,1.16,.04]);
    const midBeam=[s.side*1.08,midP[1]+.22,0],rearBeam=[s.side*1.08,rearP[1]+.22,-1.02];
    const bogiePivot=[s.side*1.08,(midBeam[1]+rearBeam[1])*.5,-.51];
    place(s.front,pivot,frontP);place(s.rear,pivot,bogiePivot);
    place(s.bogie,midBeam,rearBeam);place(s.midBrace,midP,midBeam);place(s.rearBrace,rearP,rearBeam);
