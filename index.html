<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rover marciano 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#7fc4e8;font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:100%;touch-action:none}.credit{position:fixed;z-index:2;bottom:12px;left:50%;transform:translateX(-50%);color:#26312dbb;font-size:12px;text-shadow:0 1px 3px #fff8}#status{position:fixed;inset:0;z-index:8;display:grid;place-items:center;text-align:center;padding:24px;color:#27312e;background:#d6e6df;font-size:16px;line-height:1.5}#status.hidden{display:none}@media(max-width:600px){.credit{bottom:8px;font-size:11px}}
</style>
<style>
#touch-controls{position:fixed;z-index:5;left:50%;bottom:8px;transform:translateX(-50%);width:min(680px,calc(100vw - 20px));padding:9px 12px 10px;border:1px solid #6e85965e;border-radius:18px;background:linear-gradient(145deg,#101c28f2,#1a2d3cf0);color:#e7edf2;box-shadow:0 8px 28px #0005;display:grid;gap:8px;touch-action:none;user-select:none}.joint-selector{display:flex;align-items:center;justify-content:center;gap:5px;padding-bottom:7px;border-bottom:1px solid #ffffff20}.control-caption{font-size:9px;color:#aab9c5;letter-spacing:.13em;margin-right:4px;white-space:nowrap}.joint-button{width:29px;height:24px;border:1px solid #71839288;border-radius:7px;background:#273b4b;color:#dce6ec;font:600 10px system-ui,sans-serif}.joint-button.active{background:#c68d43;border-color:#f3c77d;color:#171d22}.controller-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:15px}.joystick-wrap{display:grid;justify-items:center;gap:4px}.joystick-title{font-size:8px;letter-spacing:.16em;color:#aab9c5}.joystick{position:relative;width:98px;height:98px;border:1px solid #8096a688;border-radius:50%;background:radial-gradient(circle at 50% 48%,#32495b 0,#263c4d 54%,#172a39 56%,#101e2b 100%);box-shadow:inset 0 2px 8px #0008,0 3px 10px #0004;touch-action:none}.joystick:before,.joystick:after{content:"";position:absolute;background:#a4b5c422}.joystick:before{width:1px;top:12%;bottom:12%;left:50%}.joystick:after{height:1px;left:12%;right:12%;top:50%}.stick-knob{position:absolute;left:50%;top:50%;width:38px;height:38px;transform:translate(-50%,-50%);border:1px solid #d1e0e9aa;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9aabb6,#465d6e 72%);box-shadow:0 3px 8px #0008;pointer-events:none}.center-controls{display:grid;justify-items:center;gap:6px}.small-row{display:flex;align-items:center;gap:4px}.control-caption.center{margin:0}.mini-button,.action-button,.auto-button{border:1px solid #71839288;border-radius:7px;background:#263b4b;color:#e0e9ef;font:600 10px system-ui,sans-serif;touch-action:none;user-select:none}.mini-button{width:27px;height:26px;padding:0}.action-button{height:27px;padding:0 7px}.auto-button{width:98px;height:29px;background:#286273;border-color:#58a5ae;color:#f2fcff;font-weight:700;letter-spacing:.05em}.auto-button.active{background:#d59743;border-color:#f3c77d;color:#19212a}.mini-button:active,.action-button:active,.auto-button:active{filter:brightness(1.3)}.speed-button.active{background:#c68d43;border-color:#f3c77d;color:#171d22}.speed-readout{font:600 8px system-ui,sans-serif;color:#e7edf2;min-width:42px;text-align:right;white-space:nowrap}.zoom-label{font-size:8px;color:#aab9c5;letter-spacing:.12em;margin-right:2px}.panel-credit{font-size:7px;color:#8297a6;letter-spacing:.13em;margin-top:1px}
@media(max-width:600px){#touch-controls{width:calc(100vw - 12px);bottom:5px;padding:7px 8px 8px;gap:6px;border-radius:15px}.joint-selector{gap:4px;padding-bottom:6px}.control-caption{font-size:8px;margin-right:2px}.joint-button{width:27px;height:23px}.controller-body{grid-template-columns:1fr auto 1fr;gap:3px}.joystick{width:82px;height:82px}.stick-knob{width:34px;height:34px}.joystick-wrap{gap:3px}.joystick-title{font-size:7px}.center-controls{gap:4px}.auto-button{width:90px;height:25px;font-size:9px}.mini-button{width:23px;height:22px;font-size:9px}.action-button{height:23px;padding:0 5px;font-size:9px}.small-row{gap:3px}.control-caption.center{font-size:7px}.panel-credit{font-size:6px}.speed-readout{font-size:7px;min-width:40px}}@media(max-width:350px){.joystick{width:70px;height:70px}.stick-knob{width:29px;height:29px}.joint-button{width:24px}.joint-selector{gap:3px}.controller-body{gap:1px}.auto-button{width:80px}.mini-button{width:21px}}
</style>
</head>
<body>
<div id="status">Cargando la escena 3D… Paul Pienda</div>
<section id="touch-controls" aria-label="Controles del rover"><div class="joint-selector"><span class="control-caption">BRAZO</span><button class="joint-button active" data-motor="0">1</button><button class="joint-button" data-motor="1">2</button><button class="joint-button" data-motor="2">3</button><button class="joint-button" data-motor="3">4</button><button class="joint-button" data-motor="4">5</button><button class="joint-button" data-motor="5">6</button><button class="joint-button" data-motor="6">7</button></div><div class="controller-body"><div class="joystick-wrap"><span class="joystick-title">MOVIMIENTO</span><div class="joystick" id="drive-stick" aria-label="Joystick de movimiento"><div class="stick-knob"></div></div></div><div class="center-controls"><span class="control-caption center">ROVER 6×6</span><button id="auto-drive" class="auto-button" type="button" aria-pressed="false">AUTO AVANCE</button><div class="small-row speed-row"><span class="zoom-label">VEL.</span><button class="mini-button speed-button" data-speed="0" aria-label="Velocidad 1">1</button><button class="mini-button speed-button active" data-speed="1" aria-label="Velocidad 2">2</button><button class="mini-button speed-button" data-speed="2" aria-label="Velocidad 3">3</button><span class="speed-readout" id="speed-readout">0.0 km/h</span></div><div class="small-row"><button class="mini-button" data-key="q" aria-label="Girar cámara a la izquierda">↶</button><button class="mini-button" data-key="e" aria-label="Girar cámara a la derecha">↷</button><button class="mini-button" data-key="r" aria-label="Cámara arriba">↑</button><button class="mini-button" data-key="f" aria-label="Cámara abajo">↓</button></div><div class="small-row"><span class="zoom-label">ZOOM</span><button class="mini-button" data-zoom="out" aria-label="Alejar cámara">−</button><button class="mini-button" data-zoom="in" aria-label="Acercar cámara">+</button></div><div class="small-row"><button class="action-button" data-action="close">− CERRAR</button><button class="action-button" data-action="open">+ ABRIR</button></div><span class="panel-credit">HECHO POR SKELETON.CL</span></div><div class="joystick-wrap"><span class="joystick-title" id="stick-selection">ARTICULACIÓN 1</span><div class="joystick" id="arm-stick" aria-label="Joystick del brazo"><div class="stick-knob"></div></div></div></div></section>
<script>
const statusBox=document.querySelector('#status');
function loadThree(urls,index=0){if(index>=urls.length){statusBox.innerHTML='No se pudo cargar Three.js.<br>Conéctate a internet y recarga la página.';return}const s=document.createElement('script');s.src=urls[index];s.onload=build;s.onerror=()=>loadThree(urls,index+1);document.head.appendChild(s)}
function build(){try{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x83c7ec);scene.fog=new THREE.Fog(0x83c7ec,55,125);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,180);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.82;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xeaf7ff,0x624331,.8));const sun=new THREE.DirectionalLight(0xffe6c5,.72);sun.position.set(-9,16,8);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);
const mat=(color,roughness=.72,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const M={ground:new THREE.MeshStandardMaterial({color:0x48a642,roughness:1}),rock:new THREE.MeshStandardMaterial({color:0x858d93,roughness:.92,side:THREE.DoubleSide}),rockDark:mat(0x676e72,.9),al:mat(0xb9bcb6,.4,.5),frame:mat(0x777b75,.52,.32),body:mat(0xe3d6b5,.66,.05),deck:mat(0xd2c9ad,.6),solar:mat(0x173d68,.36,.25),tire:mat(0x252a29,.92),tread:mat(0x424845,.9),lens:mat(0x497b87,.2,.35),bottle:mat(0x759b78,.3)};
function box(parent,w,h,d,material,x=0,y=0,z=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function link(parent,r,material){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,1,16),material);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function place(o,a,b){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),d=B.clone().sub(A);o.position.copy(A).add(B).multiplyScalar(.5);o.scale.y=d.length();o.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize())}
function pin(parent,r,material){const o=new THREE.Mesh(new THREE.SphereGeometry(r,18,12),material);o.castShadow=true;parent.add(o);return o}
// Green open terrain and gray climbable rock ramps.
const floor=new THREE.Mesh(new THREE.PlaneGeometry(180,180),M.ground);floor.rotation.x=-Math.PI/2;floor.position.y=-.06;floor.receiveShadow=true;scene.add(floor);
const obstacles=[{type:'ramp',halfWidth:2.25,start:3.2,topStart:5.4,topEnd:7.0,end:9.5,height:1.15},{type:'pyramid',centerX:0,centerZ:18,halfWidth:8,halfDepth:8,height:8},{type:'irregular',centerX:0,centerZ:31.5,halfWidth:3.4,halfDepth:4.2,height:1.25},{type:'stairs',centerX:0,centerZ:40.4,halfWidth:3.5,halfDepth:3.6,steps:6,rise:.30}];
function rampHeight(z,o){if(z<=o.start||z>=o.end)return 0;if(z<o.topStart)return o.height*(z-o.start)/(o.topStart-o.start);if(z<=o.topEnd)return o.height;return o.height*(o.end-z)/(o.end-o.topEnd)}
function obstacleHeight(x,z,o){if(o.type==='pyramid'){const dx=Math.abs(x-o.centerX)/o.halfWidth,dz=Math.abs(z-o.centerZ)/o.halfDepth;return o.height*Math.max(0,1-Math.max(dx,dz))}if(o.type==='irregular'){const dx=Math.abs(x-o.centerX),dz=Math.abs(z-o.centerZ);if(dx>=o.halfWidth||dz>=o.halfDepth)return 0;const fade=Math.min(1,(o.halfWidth-dx)/.72,(o.halfDepth-dz)/.72),rough=.56+.17*Math.sin(x*2.25+z*.72)+.14*Math.cos(z*2.8-x*1.35)+.10*Math.sin((x+z)*4.2);return o.height*Math.max(.08,rough)*fade}if(o.type==='stairs'){const dx=Math.abs(x-o.centerX),start=o.centerZ-o.halfDepth,end=o.centerZ+o.halfDepth;if(dx>=o.halfWidth||z<start||z>=end)return 0;const step=Math.min(o.steps-1,Math.floor((z-start)/(2*o.halfDepth/o.steps)));return (step+1)*o.rise}const edgeRun=.95;if(Math.abs(x)>=o.halfWidth)return 0;const side=Math.min(1,(o.halfWidth-Math.abs(x))/edgeRun);return rampHeight(z,o)*side}
function groundHeight(x,z){return Math.max(0,...obstacles.map(o=>obstacleHeight(x,z,o)))}
function ramp(o){const nx=48,nz=64,positions=[],indices=[];for(let iz=0;iz<=nz;iz++){const z=o.start+(o.end-o.start)*iz/nz;for(let ix=0;ix<=nx;ix++){const x=-o.halfWidth+2*o.halfWidth*ix/nx;positions.push(x,obstacleHeight(x,z,o),z)}}for(let iz=0;iz<nz;iz++)for(let ix=0;ix<nx;ix++){const a=iz*(nx+1)+ix,b=a+1,c=a+nx+1,d=c+1;indices.push(a,c,b,b,c,d)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(indices);g.computeVertexNormals();const m=new THREE.Mesh(g,M.rock);m.castShadow=true;m.receiveShadow=true;scene.add(m)}
function pyramid(o){const x0=o.centerX-o.halfWidth,x1=o.centerX+o.halfWidth,z0=o.centerZ-o.halfDepth,z1=o.centerZ+o.halfDepth,apex=[o.centerX,o.height,o.centerZ],corners=[[x0,0,z0],[x1,0,z0],[x1,0,z1],[x0,0,z1]],positions=[];for(let i=0;i<4;i++){const a=corners[i],b=corners[(i+1)%4];positions.push(...a,...b,...apex)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.computeVertexNormals();const m=new THREE.Mesh(g,M.rock);m.castShadow=true;m.receiveShadow=true;scene.add(m)}
function irregular(o){const nx=48,nz=72,positions=[],indices=[];for(let iz=0;iz<=nz;iz++){const z=o.centerZ-o.halfDepth+2*o.halfDepth*iz/nz;for(let ix=0;ix<=nx;ix++){const x=o.centerX-o.halfWidth+2*o.halfWidth*ix/nx;positions.push(x,obstacleHeight(x,z,o),z)}}for(let iz=0;iz<nz;iz++)for(let ix=0;ix<nx;ix++){const a=iz*(nx+1)+ix,b=a+1,c=a+nx+1,d=c+1;indices.push(a,c,b,b,c,d)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));g.setIndex(indices);g.computeVertexNormals();const m=new THREE.Mesh(g,M.rock);m.castShadow=true;m.receiveShadow=true;scene.add(m)}
function staircase(o){const depth=2*o.halfDepth/o.steps;for(let i=0;i<o.steps;i++){const h=(i+1)*o.rise;box(scene,2*o.halfWidth,h,depth,M.rock,o.centerX,h/2,o.centerZ-o.halfDepth+(i+.5)*depth)}}
obstacles.forEach(o=>o.type==='pyramid'?pyramid(o):o.type==='ramp'?ramp(o):o.type==='irregular'?irregular(o):staircase(o));
// Two-sided, raised-letter railway signs around the course entrance.
const signWood=mat(0x684629,.94),signLetters=mat(0xead6a7,.72);
function raisedSignText(parent,side,label){const word=new THREE.Group();word.position.set(0,1.68,side*.119);if(side<0)word.scale.x=-1;parent.add(word);const glyphs={L:[[.08,0,.08,1],[.08,0,.78,0]],A:[[.04,0,.48,1],[.48,1,.92,0],[.22,.43,.74,.43]],N:[[.08,0,.08,1],[.92,0,.92,1],[.08,0,.92,1]],C:[[.9,1,.12,1],[.12,1,.12,0],[.12,0,.9,0]],O:[[.1,0,.1,1],[.9,0,.9,1],[.1,1,.9,1],[.1,0,.9,0]],S:[[.9,1,.12,1],[.12,1,.12,.54],[.12,.54,.9,.46],[.9,.46,.9,0],[.9,0,.12,0]],K:[[.1,0,.1,1],[.1,.5,.9,1],[.1,.5,.9,0]],E:[[.1,0,.1,1],[.1,1,.9,1],[.1,.5,.78,.5],[.1,0,.9,0]],T:[[.08,1,.92,1],[.5,1,.5,0]],'.':[[.5,.02,.5,.10]]};const chars=label.toUpperCase(),compact=chars.length>6,step=compact ? .235 : .43,h=compact ? .31 : .35,w=compact ? .19 : .32;for(let i=0;i<chars.length;i++){const cx=(i-(chars.length-1)/2)*step;for(const [x1,y1,x2,y2] of glyphs[chars[i]]||[]){const ax=(x1-.5)*w,bx=(x2-.5)*w,ay=(y1-.5)*h,by=(y2-.5)*h,dx=bx-ax,dy=by-ay,len=Math.hypot(dx,dy),stroke=new THREE.Mesh(new THREE.BoxGeometry(Math.max(len,.025),compact ? .034 : .052,.035),signLetters);stroke.position.set(cx+(ax+bx)/2,(ay+by)/2,0);stroke.rotation.z=Math.atan2(dy,dx);stroke.castShadow=true;word.add(stroke)}}}
function makeRailSign(label,x,z,rotation){const sign=new THREE.Group();sign.position.set(x,0,z);sign.rotation.y=rotation;scene.add(sign);for(const px of [-1.22,1.22])box(sign,.18,2.08,.18,signWood,px,1.04,0);box(sign,2.8,.62,.2,signWood,0,1.68,0);raisedSignText(sign,1,label);raisedSignText(sign,-1,label)}
makeRailSign('LANCO',-5.1,.9,Math.PI/2);makeRailSign('SKELETON.CL',5.1,.9,-Math.PI/2);
// Wooden, open-top bottle recycling point placed after the last stair.
const recycleWood=mat(0x684629,.94),recycleBin=new THREE.Group();recycleBin.name='punto-reciclaje';recycleBin.position.set(0,0,49.2);scene.add(recycleBin);
box(recycleBin,2.5,.14,2.4,recycleWood,0,.43,0);for(const x of [-1.18,1.18])box(recycleBin,.14,1.2,2.4,recycleWood,x,1.10,0);for(const z of [-1.13,1.13])box(recycleBin,2.5,1.2,.14,recycleWood,0,1.10,z);
const plaqueCanvas=document.createElement('canvas');plaqueCanvas.width=1024;plaqueCanvas.height=256;const plaqueCtx=plaqueCanvas.getContext('2d');plaqueCtx.fillStyle='#4b301d';plaqueCtx.fillRect(0,0,1024,256);plaqueCtx.strokeStyle='#c9a46c';plaqueCtx.lineWidth=10;plaqueCtx.strokeRect(12,12,1000,232);plaqueCtx.textAlign='center';plaqueCtx.textBaseline='middle';plaqueCtx.fillStyle='#f0dcae';plaqueCtx.font='bold 78px system-ui, sans-serif';plaqueCtx.fillText('RECICLAJE',512,88);plaqueCtx.font='bold 72px system-ui, sans-serif';plaqueCtx.fillText('DE BOTELLAS',512,174);const plaqueMap=new THREE.CanvasTexture(plaqueCanvas);plaqueMap.encoding=THREE.sRGBEncoding;const plaque=new THREE.Mesh(new THREE.PlaneGeometry(2.23,.58),new THREE.MeshBasicMaterial({map:plaqueMap,side:THREE.DoubleSide}));plaque.position.set(0,1.10,-1.205);plaque.rotation.y=Math.PI;plaque.scale.x=-1;recycleBin.add(plaque);
// Parked six-wheel cart with an open wooden collection tray; no arm, camera, or hitch.
const cart=new THREE.Group();cart.name='carro-contenedor';cart.position.set(0,0,-4);scene.add(cart);const cartWood=mat(0x8a6949,.85);box(cart,2.02,.14,2.5,cartWood,0,1.18,0);for(const x of [-.98,.98])box(cart,.08,.42,2.58,M.body,x,1.46,0);for(const z of [-1.25,1.25])box(cart,2.05,.42,.08,M.body,0,1.46,z);
for(const side of [-1,1]){for(const z of [1.02,0,-1.02]){const wheel=new THREE.Group();wheel.position.set(side*1.34,.51,z);cart.add(wheel);const tire=new THREE.Mesh(new THREE.CylinderGeometry(.51,.51,.31,32),M.tire);tire.rotation.z=Math.PI/2;tire.castShadow=true;tire.receiveShadow=true;wheel.add(tire);const hub=new THREE.Mesh(new THREE.CylinderGeometry(.21,.21,.35,20),M.al);hub.rotation.z=Math.PI/2;wheel.add(hub);for(let i=0;i<16;i++){const a=i*Math.PI*2/16,t=box(wheel,.33,.05,.07,M.tread,0,Math.cos(a)*.515,Math.sin(a)*.515);t.rotation.x=a}}const rocker=link(cart,.085,M.frame),bogie=link(cart,.075,M.al);place(rocker,[side*1.06,1.03,.1],[side*1.34,.51,1.02]);place(bogie,[side*1.06,1.03,.1],[side*1.34,.51,-1.02]);const pivot=pin(cart,.12,M.al);pivot.position.set(side*1.06,1.03,.1)}
// Rover: body, six powered wheels and the six-axis science arm.
const rover=new THREE.Group();scene.add(rover);const chassis=new THREE.Group();rover.add(chassis);
box(chassis,2.05,.43,2.58,M.body,0,1.45,0);box(chassis,2.14,.07,2.65,M.al,0,1.70,0);box(chassis,1.54,.22,1.46,M.deck,0,1.82,-.05);box(chassis,.78,.045,1.26,M.solar,0,1.96,-.05);for(const x of [-.25,0,.25])box(chassis,.022,.01,1.2,M.al,x,1.99,-.05);
// Mast and stereo navigation cameras.
const mast=link(chassis,.055,M.al);mast.position.set(0,2.18,-.62);mast.scale.y=.62;const mastPan=new THREE.Group();mastPan.position.set(0,2.5,-.62);chassis.add(mastPan);const mastHead=new THREE.Group();mastPan.add(mastHead);box(mastHead,.56,.31,.46,M.frame);box(mastHead,.38,.17,.12,M.lens,0,.01,.25);for(const x of [-.14,.14]){const lens=new THREE.Mesh(new THREE.CylinderGeometry(.06,.06,.035,16),M.lens);lens.rotation.x=Math.PI/2;lens.position.set(x,.01,.32);mastHead.add(lens)}
// Six wheels, with aligned hubs, caps and visible traction bars.
const wheelR=.51,wheels=[];for(const side of [-1,1])for(let n=0;n<3;n++){const z=[1.02,0,-1.02][n],hubGroup=new THREE.Group();hubGroup.position.set(side*1.34,wheelR,z);rover.add(hubGroup);const wheel=new THREE.Group();hubGroup.add(wheel);const tire=new THREE.Mesh(new THREE.CylinderGeometry(wheelR,wheelR,.31,40),M.tire);tire.rotation.z=Math.PI/2;tire.castShadow=true;tire.receiveShadow=true;wheel.add(tire);for(const [r,len,material] of [[.24,.34,M.al],[.12,.36,M.frame]]){const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,24),material);c.rotation.z=Math.PI/2;wheel.add(c)}for(let i=0;i<20;i++){const a=i*Math.PI*2/20,t=box(wheel,.34,.055,.075,M.tread,0,Math.cos(a)*(wheelR+.012),Math.sin(a)*(wheelR+.012));t.rotation.x=a}wheels.push({side,n,z,hubGroup,wheel})}
// Rocker-bogie arms adjust to the sampled ground height under each wheel.
const suspension=[];for(const side of [-1,1]){box(chassis,.22,.24,.32,M.frame,side*1.05,1.16,.04);const front=link(rover,.075,M.al),rear=link(rover,.075,M.al),bogie=link(rover,.075,M.frame),midBrace=link(rover,.045,M.al),rearBrace=link(rover,.045,M.al),joints=Array.from({length:5},()=>pin(rover,.105,M.frame));suspension.push({side,front,rear,bogie,midBrace,rearBrace,joints})}
// Visible differential across the chassis.
